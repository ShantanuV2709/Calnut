{% extends "base.html" %}
{% block title %}Register | Calnut{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center relative overflow-hidden">
  <!-- Back Text -->
  <div class="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none select-none">
    <span class="text-[12rem] md:text-[20rem] font-bold tracking-tighter text-blue-800">JOIN</span>
  </div>

  <div class="glass-card p-8 md:p-12 rounded-3xl w-full max-w-md relative z-10 shadow-2xl">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900">Create Account</h2>
      <p class="text-gray-500 mt-2">Start your personalized fitness journey</p>
    </div>

    <form method="POST" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
        <input type="text" name="username"
          class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium text-gray-900"
          required>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
        <input type="email" name="email"
          class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium text-gray-900"
          required>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
        <input type="password" name="password1"
          class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium text-gray-900"
          required>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Confirm Password</label>
        <input type="password" name="password2"
          class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium text-gray-900"
          required>
      </div>

      <button type="submit"
        class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-500 text-white font-bold text-lg shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-1 transition-all duration-300">
        Register
      </button>
    </form>

    <p class="text-center mt-8 text-gray-600">
      Already have an account?
      <a href="{% url 'login' %}" class="font-bold text-green-600 hover:text-green-700 hover:underline">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
