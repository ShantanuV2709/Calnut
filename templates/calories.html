{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-12">
  <div class="text-center relative">
    <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none select-none">
      <span class="text-9xl md:text-[12rem] font-bold tracking-tighter text-orange-500">BURN</span>
    </div>
    <h1 class="relative text-4xl font-extrabold text-gray-900 sm:text-5xl mt-8">Calorie Calculator</h1>
    <p class="relative mt-3 text-lg text-gray-500">Calculate your optimal daily calorie intake based on your goals.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Form Section -->
    <div class="md:col-span-2">
      <div class="glass-card rounded-3xl p-8 shadow-xl">
        <form id="calorieForm" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-sm font-bold text-gray-700 tracking-wide">Gender</label>
              <div class="relative">
                <select id="gender"
                  class="block w-full pl-4 pr-10 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none appearance-none font-medium text-gray-700">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                  <i class="fas fa-chevron-down text-xs"></i>
                </div>
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-bold text-gray-700 tracking-wide">Age</label>
              <input type="number" id="age"
                class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium"
                placeholder="25">
            </div>

            <div class="space-y-2">
              <label class="text-sm font-bold text-gray-700 tracking-wide">Weight (kg)</label>
              <input type="number" id="weight"
                class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium"
                placeholder="70">
            </div>

            <div class="space-y-2">
              <label class="text-sm font-bold text-gray-700 tracking-wide">Height (cm)</label>
              <input type="number" id="height"
                class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none font-medium"
                placeholder="175">
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700 tracking-wide">Activity Level</label>
            <div class="relative">
              <select id="activity"
                class="block w-full pl-4 pr-10 py-3 bg-gray-50 border-transparent rounded-xl focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all outline-none appearance-none font-medium text-gray-700">
                <option value="1.2">Sedentary (Office job / Little exercise)</option>
                <option value="1.375">Lightly Active (1-3 days/week)</option>
                <option value="1.55">Moderately Active (3-5 days/week)</option>
                <option value="1.725">Very Active (6-7 days/week)</option>
                <option value="1.9">Extra Active (Physical job + Training)</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </div>

          <button type="submit"
            class="w-full py-4 rounded-xl bg-gradient-to-r from-green-600 to-teal-500 text-white font-bold text-lg shadow-lg shadow-green-500/30 hover:shadow-green-500/50 hover:-translate-y-1 transition-all duration-300">
            Calculate My Calories
          </button>
        </form>
      </div>
    </div>

    <!-- Result Section -->
    <div class="md:col-span-1">
      <div id="resultCard"
        class="glass-card rounded-3xl p-8 h-full flex flex-col items-center justify-center text-center opacity-50 pointer-events-none transition-all duration-500 relative overflow-hidden">

        <!-- Placeholder State -->
        <div id="placeholderState">
          <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 mx-auto mb-4">
            <i class="fas fa-chart-pie text-3xl"></i>
          </div>
          <p class="text-gray-400 font-medium">Enter your details to see your calorie breakdown.</p>
        </div>

        <!-- Active State (Hidden initially) -->
        <div id="activeState" class="hidden w-full">
          <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-400 to-red-500"></div>
          <h3 class="text-gray-500 uppercase tracking-widest text-xs font-bold mb-2">Daily Maintenance</h3>
          <div class="flex items-baseline justify-center gap-1 mb-6">
            <span id="calories"
              class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-teal-600">--</span>
            <span class="text-gray-400 font-bold">kcal</span>
          </div>

          <div class="space-y-4 w-full">
            <div class="p-4 rounded-xl bg-blue-50 border border-blue-100">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-blue-500 uppercase">Weight Loss</span>
                <i class="fas fa-long-arrow-alt-down text-blue-500"></i>
              </div>
              <span id="lossCalories" class="text-xl font-bold text-gray-800">--</span>
            </div>
            <div class="p-4 rounded-xl bg-orange-50 border border-orange-100">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-orange-500 uppercase">Weight Gain</span>
                <i class="fas fa-long-arrow-alt-up text-orange-500"></i>
              </div>
              <span id="gainCalories" class="text-xl font-bold text-gray-800">--</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('calorieForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const gender = document.getElementById('gender').value;
    const age = parseFloat(document.getElementById('age').value);
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value);
    const activity = parseFloat(document.getElementById('activity').value);

    if (!age || !weight || !height) return;

    // BMR Calculation (Mifflin-St Jeor Equation)
    let bmr;
    if (gender === 'male') {
      bmr = 10 * weight + 6.25 * height - 5 * age + 5;
    } else {
      bmr = 10 * weight + 6.25 * height - 5 * age - 161;
    }

    const tdee = Math.round(bmr * activity);
    const lose = Math.round(tdee - 500);
    const gain = Math.round(tdee + 500);

    // Update UI
    const resultCard = document.getElementById('resultCard');
    const placeholderState = document.getElementById('placeholderState');
    const activeState = document.getElementById('activeState');

    document.getElementById('calories').textContent = tdee;
    document.getElementById('lossCalories').textContent = lose + " kcal";
    document.getElementById('gainCalories').textContent = gain + " kcal";

    resultCard.classList.remove('opacity-50', 'pointer-events-none');
    placeholderState.classList.add('hidden');
    activeState.classList.remove('hidden');
  });
</script>
{% endblock %}
