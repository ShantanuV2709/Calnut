{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-8">
    <div class="glass-card p-8 rounded-3xl relative overflow-hidden text-center">
        <div class="absolute inset-0 bg-gradient-to-r from-purple-500/10 to-pink-500/10 pointer-events-none"></div>
        <h1 class="text-3xl font-extrabold text-gray-900 relative z-10">Weekly Analytics</h1>
        <p class="text-gray-500 mt-2 relative z-10">Track your nutrition trends over the past 7 days</p>
    </div>

    <!-- Calorie Chart -->
    <div class="glass-card p-6 rounded-3xl">
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fas fa-fire text-orange-500"></i> Daily Calorie Intake
        </h2>
        <canvas id="caloriesChart" height="80"></canvas>
    </div>

    <!-- Protein Chart -->
    <div class="glass-card p-6 rounded-3xl">
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fas fa-drumstick-bite text-blue-500"></i> Daily Protein Intake
        </h2>
        <canvas id="proteinChart" height="80"></canvas>
    </div>

    <!-- Water Chart -->
    <div class="glass-card p-6 rounded-3xl">
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fas fa-tint text-blue-400"></i> Daily Water Intake
        </h2>
        <canvas id="waterChart" height="80"></canvas>
    </div>
</div>

<script>
    const labels = {{ labels| safe }};
    const caloriesData = {{ calories_data| safe }};
    const proteinData = {{ protein_data| safe }};
    const waterData = {{ water_data| safe }};

    // Calorie Chart
    const caloriesCtx = document.getElementById('caloriesChart').getContext('2d');
    new Chart(caloriesCtx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Calories (kcal)',
                data: caloriesData,
                borderColor: 'rgb(234, 88, 12)',
                backgroundColor: 'rgba(234, 88, 12, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Protein Chart
    const proteinCtx = document.getElementById('proteinChart').getContext('2d');
    new Chart(proteinCtx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Protein (g)',
                data: proteinData,
                backgroundColor: 'rgba(59, 130, 246, 0.7)',
                borderColor: 'rgb(59, 130, 246)',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Water Chart
    const waterCtx = document.getElementById('waterChart').getContext('2d');
    new Chart(waterCtx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Water (Liters)',
                data: waterData,
                borderColor: 'rgb(96, 165, 250)',
                backgroundColor: 'rgba(96, 165, 250, 0.2)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
