{% extends "base.html" %}
{% block title %}Progress Graphs{% endblock %}

{% block body %}
<style>
  body {
    background: linear-gradient(135deg, #d0f0c0, #f0fff0);
    animation: backgroundGlow 6s ease-in-out infinite alternate;
  }

  @keyframes backgroundGlow {
    from { background-color: #f0fff0; }
    to { background-color: #e0ffe0; }
  }

  .chart-container {
    width: 100%;
    max-width: 900px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
  }

  canvas {
    width: 100% !important;
    height: auto !important;
  }
</style>

<div class="chart-container">
  <h3 class="text-center mb-4">Calorie Intake vs Burn</h3>
  <canvas id="calorieChart"></canvas>
</div>

<div class="chart-container">
  <h3 class="text-center mb-4">Weight Progress</h3>
  <canvas id="weightChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const calorieCtx = document.getElementById('calorieChart').getContext('2d');
  const calorieChart = new Chart(calorieCtx, {
    type: 'line',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      datasets: [
        {
          label: 'Calories Consumed',
          data: [2100, 1800, 2300, 2000, 2200, 2500, 1900],
          borderColor: '#4CAF50',
          backgroundColor: 'rgba(76, 175, 80, 0.1)',
          tension: 0.4,
          pointRadius: 5,
          pointHoverRadius: 8
        },
        {
          label: 'Calories Burned',
          data: [1500, 1600, 1700, 1800, 1750, 1600, 1650],
          borderColor: '#FF9800',
          backgroundColor: 'rgba(255, 152, 0, 0.1)',
          tension: 0.4,
          pointRadius: 5,
          pointHoverRadius: 8
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            font: {
              size: 14
            }
          }
        }
      }
    }
  });

  const weightCtx = document.getElementById('weightChart').getContext('2d');
  const weightChart = new Chart(weightCtx, {
    type: 'line',
    data: {
      labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
      datasets: [{
        label: 'Weight (kg)',
        data: [72, 71, 70.5, 70],
        borderColor: '#2196F3',
        backgroundColor: 'rgba(33, 150, 243, 0.1)',
        tension: 0.3,
        pointRadius: 6,
        pointHoverRadius: 9
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            font: {
              size: 14
            }
          }
        }
      }
    }
  });
</script>
{% endblock %}
