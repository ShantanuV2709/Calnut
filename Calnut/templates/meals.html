{% extends "base.html" %}
{% block title %}Meal Suggestions{% endblock %}

{% block body %}
<style>
  body {
    background: linear-gradient(to bottom right, #f0fff0, #e6f9e6);
  }

  .meal-container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
  }

  .meal-title {
    font-size: 2rem;
    text-align: center;
    font-weight: 600;
    color: #2e7d32;
    margin-bottom: 30px;
  }

  .meal-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 128, 0, 0.15);
    padding: 20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .meal-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(0, 128, 0, 0.25);
  }

  .meal-img {
    border-radius: 15px;
    width: 100%;
    height: 200px;
    object-fit: cover;
  }

  .meal-name {
    font-size: 1.25rem;
    font-weight: bold;
    margin-top: 15px;
    color: #388e3c;
  }

  .meal-info {
    font-size: 0.95rem;
    margin-top: 10px;
    color: #555;
  }
</style>

<div class="meal-container">
  <h2 class="meal-title">Today's Meal Suggestions</h2>
  <div class="row g-4">
    {% for meal in meals %}
    <div class="col-md-4">
      <div class="meal-card">
        <img src="{{ meal.image }}" alt="{{ meal.name }}" class="meal-img">
        <div class="meal-name">{{ meal.name }}</div>
        <div class="meal-info">{{ meal.description }}</div>
        <div class="meal-info"><strong>Calories:</strong> {{ meal.calories }} kcal</div>
        <div class="meal-info"><strong>Protein:</strong> {{ meal.protein }}g</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
